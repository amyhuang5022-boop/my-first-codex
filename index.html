<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一個 Codex 專案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f0f5fb; color: #172b46; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 620px; padding: 48px 32px; border-radius: 24px; background: white; text-align: center; box-shadow: 0 16px 48px #172b4610; }
    .label { color: #486b9c; font-size: 14px; letter-spacing: 2px; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.4; }
    p { line-height: 1.8; }
    button { margin-top: 16px; padding: 14px 28px; border: none; border-radius: 12px; background: #2459c4; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #19469f; }
    button:focus-visible { outline: 3px solid #91b9ff; outline-offset: 4px; }
    #message { min-height: 2em; margin-bottom: 0; color: #2459c4; }
  </style>
</head>
<body>
  <main>
    <p class="label">一起開始創作</p>
    <h1>我的第一個 Codex 專案</h1>
    <p>歡迎來到我的第一個 Codex 專案！<br>從這個小小的網頁開始，一起把想法變成作品。</p>
    <button id="welcome-button" type="button">點我打聲招呼</button>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('welcome-button').addEventListener('click', () => {
      document.getElementById('message').textContent = '你好！歡迎一起探索 Codex 的可能性！';
    });
  </script>
</body>
</html>
